name: Teste import motor

on:
  push:
    paths:
      - '**.py'
      - '.github/**'
  workflow_dispatch:

jobs:
  run-test-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências (se houver)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Executar teste de importação do motor
        run: |
          python -u test_import_motor.py
