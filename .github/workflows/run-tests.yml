name: Run A2F2 motor tests

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "principal" ]
    paths:
      - "**/*.py"
      
jobs:
  run-motor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
              - name: Install optional requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          python -u run_test.py
